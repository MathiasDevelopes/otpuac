[workspace]
members = [
    "crates/otpuac-core",
    "crates/otpuac-provider",
    "crates/otpuac-setup",
]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "GPL-3.0-only"
license-file = "LICENSE"

[workspace.dependencies]
otpuac-core = { path = "crates/otpuac-core" }

clap = { version = "4.6", features = ["derive"] }
data-encoding = "2.11"
hmac = "0.13"
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha1 = { version = "0.11", default-features = false }
subtle = "2.6"
thiserror = "2.0.18"
windows-sys = "0.61"
zeroize = "1.9"

name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    - name: Build
      run: cargo build --verbose --workspace
    - name: Run tests
      run: cargo test --verbose --workspace

  installer:

    runs-on: windows-latest

    env:
      TARGET: x86_64-pc-windows-msvc
      WIX_VERSION: 5.0.2

    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-installer-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-installer-
    - name: Install WiX Toolset
      shell: pwsh
      run: dotnet tool install --global wix --version $env:WIX_VERSION
    - name: Build MSI
      shell: pwsh
      run: .\scripts\build-installer.ps1 -Target $env:TARGET -AppVersion 0.0.0-ci -WixVersion $env:WIX_VERSION -Locked
    - name: Install and uninstall MSI
      shell: powershell
      run: .\scripts\test-installer.ps1 -Msi dist\OTPUAC-0.0.0-ci-x64.msi
    - name: Upload MSI and installer logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: otpuac-msi-ci
        path: |
          dist/*.msi
          dist/installer-logs/
        if-no-files-found: warn
